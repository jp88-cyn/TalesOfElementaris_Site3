<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL</title>
    <link rel="shortcut icon" href="images/icon.png" type="image/x-icon">
    <style>
        /* ===== FONTES ===== */
        @font-face {
            font-family: 'vcr';
            src: url('fonts/VCR_OSD_MONO_1.001.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: rgba(0, 0, 0, 0.6) url(videos/VideoAnotherHim.gif) center/cover;
            background-blend-mode: overlay;
            color: #888888;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER FIXO ===== */
        .terminal-header {
            background: rgba(0, 0, 0, 0.9);
            padding: 12px 20px;
            border-bottom: 2px solid #888888;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .terminal-header .logo {
            font-family: 'vcr', monospace;
            font-size: 1.3rem;
            color: #888888;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #888888;
        }

        .btn-voltar {
            color: #888888;
            text-decoration: none;
            font-family: 'vcr', monospace;
            font-size: 1.2rem;
            padding: 6px 18px;
            border: 2px solid #888888;
            border-radius: 30px;
            transition: all 0.3s;
            background: transparent;
            cursor: pointer;
            display: inline-block;
        }

        .btn-voltar:hover {
            background: #f3f2f2;
            color: #0a0a0a;
            box-shadow: 0 0 20px #888888;
        }

        /* ===== CONTAINER PRINCIPAL ===== */
        .terminal-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            height: 100%;
            min-height: 0;
            overflow: hidden;
        }

        /* ===== ÁREA DE SAÍDA ===== */
        .terminal-output {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
            padding: 12px 16px;
            margin-bottom: 15px;
            border: 1px solid #a5a5a544;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            font-size: 1rem;
            line-height: 1.6;
            min-height: 0;
            height: 100%;
            box-sizing: border-box;
        }

        /* ===== SCROLLBAR PERSONALIZADA ===== */
        .terminal-output::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        .terminal-output::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 8px;
        }

        .terminal-output::-webkit-scrollbar-thumb {
            background: #888888;
            border-radius: 8px;
            border: 2px solid #0a0a0a;
            transition: background 0.3s;
        }

        .terminal-output::-webkit-scrollbar-thumb:hover {
            background: #4b4b4b;
        }

        .terminal-output::-webkit-scrollbar-corner {
            background: #1a1a1a;
        }

        /* Firefox */
        .terminal-output {
            scrollbar-width: thin;
            scrollbar-color: #888888 #1a1a1a;
        }

        /* ===== LINHAS DO TERMINAL ===== */
        .terminal-output p {
            margin: 3px 0;
            color: #ffffff;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 1.2em;
        }

        /* ===== CORES PERSONALIZADAS PARA PERSONAGENS ===== */
        .terminal-output p.cor-raiko { color: #ff4444; }
        .terminal-output p.cor-william { color: #aa44ff; }
        .terminal-output p.cor-mary { color: #ff66b2; }
        .terminal-output p.cor-satoshi { color: #8f8e92; }
        .terminal-output p.cor-hank { color: #ffdd44; }
        .terminal-output p.cor-kitsune { color: #ff8800; }
        .terminal-output p.cor-milly { color: #f583ef; }
        .terminal-output p.cor-agnes { color: #692a75; }
        .terminal-output p.cor-hannah { color: #eee9ee; }
        .terminal-output p.cor-fenrir { color: #8532ac; }
        
        /* Adicione mais cores aqui */

        /* Cores especiais para palavras-chave (sobrescrevem a cor do personagem) */
        .terminal-output p .destaque { color: #ffcc00 !important; }
        .terminal-output p .erro { color: #f50404 !important; }
        .terminal-output p .system { color: #05e423 !important; }

        /* ===== CURSOR DE DIGITAÇÃO ===== */
        .typing-cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background: #f4f5f4;
            animation: pisca 0.8s step-end infinite;
            margin-left: 2px;
            vertical-align: text-bottom;
        }

        @keyframes pisca {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ===== INPUT ===== */
        .terminal-input-line {
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #5b5c5b44;
            padding-top: 12px;
            flex-shrink: 0;
        }

        .terminal-input-line span {
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1rem;
        }

        #cmdInput {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 2px solid #888888;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            padding: 6px 8px;
            outline: none;
            transition: border-color 0.3s;
        }

        #cmdInput:focus {
            border-bottom-color: #888888;
        }

        #cmdInput::placeholder {
            color: #888888;
        }

        .btn-enviar {
            background: #888888;
            color: #0a0a0a;
            border: none;
            padding: 8px 18px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-enviar:hover {
            background: #f0f3f0;
            transform: scale(1.05);
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 600px) {
            .terminal-header .logo {
                font-size: 1rem;
            }
            .btn-voltar {
                font-size: 1rem;
                padding: 4px 14px;
            }
            .terminal-container {
                padding: 10px;
            }
            .terminal-output {
                font-size: 0.9rem;
                padding: 8px 10px;
            }
            .terminal-output::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            #cmdInput {
                font-size: 0.9rem;
                padding: 4px 6px;
            }
            .btn-enviar {
                padding: 6px 14px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 400px) {
            .terminal-header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .btn-voltar {
                align-self: center;
            }
        }
    </style>
</head>
<body>
    <header class="terminal-header">
        <span class="logo"> V.E.S.S.E.L </span>
        <a href="index.html" class="btn-voltar">⬅ Voltar</a>
    </header>

    <div class="terminal-container">
        <div class="terminal-output" id="terminalOutput"></div>

        <div class="terminal-input-line">
            <span>$</span>
            <input type="text" id="cmdInput" placeholder="digite algo..." autofocus>
            <button class="btn-enviar" id="btnEnviar">⏎</button>
        </div>
    </div>

    <!-- ===== ÁUDIOS ===== -->
    <audio id="backgroundMusic" loop preload="auto">
        <source src="sounds/background_music.mp3" type="audio/mpeg">
    </audio>
    <audio id="typingSound" preload="auto">
        <source src="sounds/typing.wav" type="audio/wav">
    </audio>
    <audio id="messageSound" preload="auto">
        <source src="sounds/snd_knight_rotatingslash_line.wav" type="audio/wav">
    </audio>
    <audio id="kamaitachiMusic" preload="auto">
        <source src="sounds/bury.mp3" type="audio/mpeg">
    </audio>

    <script>
        // =============================================================
        // CONFIGURAÇÕES
        // =============================================================
        const CONFIG = {
            backgroundVolume: 0.1,
            typingSoundEnabled: true,
            messageSoundEnabled: true,
            messageSoundVolume: 0.2,
            kamaitachiVolume: 0.4,
            larryImageUrl: 'images/larry_secret.png',
            larryImageFilename: 'larry_secret_image.png',
            athenaRedirectUrl: 'https://project2-nine-rust.vercel.app/',
            millyRedirectUrl: 'https://project1-alpha-smoky-59.vercel.app/',
            agnesRedirectUrl: 'https://project3-one-mu.vercel.app/',
            typingSpeed: 35,
            lineDelay: 300,
        };

        // =============================================================
        // REFERÊNCIAS DOM
        // =============================================================
        const output = document.getElementById('terminalOutput');
        const input = document.getElementById('cmdInput');
        const btnEnviar = document.getElementById('btnEnviar');

        const bgMusic = document.getElementById('backgroundMusic');
        const typingSound = document.getElementById('typingSound');
        const msgSound = document.getElementById('messageSound');
        const kamaitachiMusic = document.getElementById('kamaitachiMusic');

        // =============================================================
        // VARIÁVEIS DE ESTADO
        // =============================================================
        let isKamaitachiMode = false;
        let isProcessingQueue = false;
        let messageQueue = [];
        let kamaitachiAtivo = false;

        // Ajusta volumes
        bgMusic.volume = CONFIG.backgroundVolume;
        msgSound.volume = CONFIG.messageSoundVolume;
        kamaitachiMusic.volume = CONFIG.kamaitachiVolume;
        kamaitachiMusic.loop = false;

        // =============================================================
        // INICIALIZAÇÃO
        // =============================================================
        document.addEventListener('click', function firstInteraction() {
            bgMusic.play().catch(e => console.log('Música não pôde ser reproduzida:', e));
            document.removeEventListener('click', firstInteraction);
        }, { once: true });

        // Mensagens iniciais
        const mensagensIniciais = [
            'V.E.S.S.E.L OS v3.0.1',
            'Carregando módulos... OK.',
            'Verificando integridade do multiverso... INSTÁVEL.',
            'Conexão estabelecida. Digite um comando ou nome para interagir.',
            'Digite "help" para lista de palavras-chave.'
        ];
        exibirMensagens(mensagensIniciais);

        // =============================================================
        // FUNÇÕES DE ÁUDIO
        // =============================================================
        function playTyping() {
            if (!CONFIG.typingSoundEnabled) return;
            typingSound.currentTime = 0;
            typingSound.play().catch(e => console.log('Som de digitação não pôde ser reproduzido:', e));
        }

        function playMessageSound() {
            if (!CONFIG.messageSoundEnabled) return;
            msgSound.currentTime = 0;
            msgSound.play().catch(e => console.log('Som de mensagem não pôde ser reproduzido:', e));
        }

        function switchToKamaitachiMode() {
            if (kamaitachiAtivo) return;
            kamaitachiAtivo = true;
            isKamaitachiMode = true;
            bgMusic.pause();
            kamaitachiMusic.currentTime = 0;
            kamaitachiMusic.play().catch(e => console.log('Música Kamaitachi não pôde ser reproduzida:', e));
        }

        function voltarMusicaPadrao() {
            if (!kamaitachiAtivo) return;
            kamaitachiAtivo = false;
            isKamaitachiMode = false;
            kamaitachiMusic.pause();
            kamaitachiMusic.currentTime = 0;
            bgMusic.play().catch(e => console.log('Música de fundo não pôde ser reproduzida:', e));
        }

        // =============================================================
        // SCROLL AUTOMÁTICO
        // =============================================================
        function scrollToBottomIfNeeded() {
            const threshold = 30;
            const isAtBottom = output.scrollHeight - output.scrollTop - output.clientHeight < threshold;
            if (isAtBottom) {
                output.scrollTop = output.scrollHeight;
            }
        }

        // =============================================================
        // DIGITAÇÃO LETRA POR LETRA
        // =============================================================
        function digitarLinha(texto, elemento) {
            return new Promise((resolve) => {
                elemento.textContent = '';
                let index = 0;
                const cursor = document.createElement('span');
                cursor.className = 'typing-cursor';
                elemento.appendChild(cursor);

                function adicionarLetra() {
                    if (index < texto.length) {
                        const char = texto.charAt(index);
                        elemento.insertBefore(document.createTextNode(char), cursor);
                        index++;
                        playTyping();
                        scrollToBottomIfNeeded();
                        setTimeout(adicionarLetra, CONFIG.typingSpeed);
                    } else {
                        if (cursor.parentNode) {
                            cursor.parentNode.removeChild(cursor);
                        }
                        playMessageSound();
                        scrollToBottomIfNeeded();
                        resolve();
                    }
                }
                adicionarLetra();
            });
        }

        // =============================================================
        // EXIBIR FILA DE MENSAGENS
        // =============================================================
        async function exibirMensagens(mensagens, corClasse = '') {
            if (!mensagens || mensagens.length === 0) return;

            if (mensagens.length === 1 && mensagens[0] === '') {
                output.innerHTML = '';
                return;
            }

            messageQueue.push({ texto: mensagens, cor: corClasse });

            if (isProcessingQueue) return;
            isProcessingQueue = true;

            while (messageQueue.length > 0) {
                const item = messageQueue.shift();
                const linhas = item.texto;
                const cor = item.cor;

                for (const linha of linhas) {
                    const p = document.createElement('p');
                    
                    if (cor) {
                        p.className = cor;
                    }

                    output.appendChild(p);

                    // Estilos especiais (sobrescrevem a cor da classe)
                    if (linha.includes('ERRO') || linha.includes('FATAL')) {
                        p.style.color = '#ff5555';
                    } else if (linha.includes('DESTAQUE') || linha.includes('BURY')) {
                        p.style.color = '#ffcc00';
                    } else if (linha.includes('SISTEMA') || linha.includes('V.E.S.S.E.L')) {
                        p.style.color = '#88ccff';
                    }

                    await digitarLinha(linha, p);
                    await new Promise(resolve => setTimeout(resolve, CONFIG.lineDelay));

                    // =========================================================
                    // PALAVRAS ESPECIAIS (AINDA MANTIDAS PARA COMPATIBILIDADE)
                    // =========================================================
                    if (linha.includes('KAMAITACHI')) {
                        switchToKamaitachiMode();
                    }

                    if (linha.includes('BURY THE LIGHT') && kamaitachiAtivo) {
                        setTimeout(() => {
                            voltarMusicaPadrao();
                        }, 3000);
                    }

                    if (linha.includes('LARRY DETECTADO')) {
                        downloadImage(CONFIG.larryImageUrl, CONFIG.larryImageFilename);
                    }

                    // REMOVIDO: o redirecionamento agora é feito pelo comando original
                    // em processCommand()
                }
            }

            isProcessingQueue = false;
        }

        // =============================================================
        // DOWNLOAD (Larry)
        // =============================================================
        function downloadImage(url, filename) {
            const link = document.createElement('a');
            link.href = url;
            link.download = filename || 'larry_secret.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // =============================================================
        // BANCO DE RESPOSTAS
        // =============================================================
        function getMensagens(userName) {
            const lowerUserName = userName.toLowerCase().trim();

            // Comandos especiais
            if (lowerUserName === 'help') {
                return {
                    mensagens: [
                        'Palavras-chave disponíveis:',
                        '  - Nomes de personagens (ex: raiko, mary, satoshi, etc.)',
                        '  - Comandos: help, status, clear, about',
                        'Digite um nome ou comando para interagir.'
                    ],
                    cor: ''
                };
            }

            if (lowerUserName === 'status') {
                return {
                    mensagens: [
                        'SISTEMA: ONLINE',
                        'MULTIVERSO: INSTÁVEL',
                        'CONECTADOS ATIVOS: 8',
                        'MEMÓRIA: 88% UTILIZADA',
                        'UPTIME: 3 dias, 14 horas'
                    ],
                    cor: ''
                };
            }

            if (lowerUserName === 'clear') {
                return { mensagens: [''], cor: '' };
            }

            if (lowerUserName === 'about') {
                return {
                    mensagens: [
                        'V.E.S.S.E.L Terminal v8.8.8',
                        'Um lugar para suas ideias.',
                    ],
                    cor: ''
                };
            }

            // Easter Eggs
            if (lowerUserName === 'larry') {
                return {
                    mensagens: [
                        'LARRY DETECTADO.',
                        'INICIANDO DOWNLOAD ✍'
                    ],
                    cor: ''
                };
            }

            if (lowerUserName === 'athena') {
                return {
                    mensagens: [
                        'A ANOMALIA, VOCÊ DIZ?',
                        'PENSE BEM ANTES DE CHAMAR ALGUÉM QUE NÃO EXISTE, POR FAVOR.'
                    ],
                    cor: 'cor-hank'
                };
            }

            if (lowerUserName === 'kamaitachi') {
                return {
                    mensagens: [
                        'KAMAITACHI.',
                        'BURY THE LIGHT',
                        'BURY THE LIGHT',
                        'BURY THE LIGHT',
                        'BURY THE LIGHT',
                        'BURY THE LIGHT',
                        'BURY THE LIGHT',
                        'BURY THE LIGHT',
                        'BURY THE LIGHT',
                        'BURY THE LIGHT',
                        'BURY THE LIGHT',
                        'BURY THE LIGHT',
                        'BURY THE LIGHT'
                    ],
                    cor: ''
                };
            }

            if (lowerUserName === 'vessel') {
                return {
                    mensagens: [
                        'ERRO : RESTABELECENDO CONEXÃO',
                    ],
                    cor: ''
                };
            }

            // =============================================================
            // MILLY E AGNES (COM TEXTO PERSONALIZADO, MAS REDIRECIONAMENTO
            // SERÁ FEITO PELO COMANDO EM processCommand)
            // =============================================================
            if (lowerUserName === 'milly') {
                return {
                    mensagens: [
                        'MILLY ?.',
                        'QUEM É MILLY?'
                    ],
                    cor: 'cor-milly'
                };
            }

            if (lowerUserName === 'agnes') {
                return {
                    mensagens: [
                        'OBJETO NÃO IDENTIFICADO PELO AUTENTICADOR.',
                        'TENTE OUTRA COISA.'
                    ],
                    cor: 'cor-agnes'
                };
            }

            // =============================================================
            // PERSONAGENS COM CORES PERSONALIZADAS
            // =============================================================
            if (lowerUserName === 'hannah' || lowerUserName === 'hanna') {
                return {
                    mensagens: [
                        "A FILHA DE MENTIRA?",
                        "ME IMPRESSIONA QUE ALGUÉM TENHA SENTIDO PELA CAUSA DELA",
                        "AFINAL, ELA É FILHA DE UM CONECTADO",
                        "E CONECTADOS, TENDO FILHOS COM NPCS, NUNCA DÁ CERTO",
                        "ESSÊNCIAS NÃO SÃO FEITAS PARA ISSO."
                    ],
                    cor: 'cor-hannah'
                };
            }

            if (lowerUserName === 'raiko') {
                return {
                    mensagens: [
                        'RAIKO YASHI.',
                        'HAISE.',
                        'VOCÊ É TÃO DESTRUTIVO',
                        'QUE CONSEGUE ACABAR COM SUA PRÓPRIA ALMA.',
                        'ISSO ME DEIXA CURIOSO PARA VER ATÉ ONDE VOCÊ CHEGA TENTANDO CONTRA MIM',
                        'JÁ QUE VOCÊ SEMPRE TENTA TRAZER QUEM VOCÊ AMA APENAS COMO DESCULPA',
                        'UMA DESCULPA PARA SEUS ATOS DE DESTRUIÇÃO SEM NEXO.',
                        'MAS, PARA QUE INIMIGOS SE VOCÊ TEM A SI MESMO, NÃO É?',
                        'SE SUA ESSÊNCIA ESTÁ DO JEITO QUE ESTÁ, VOCÊ SABE MUITO BEM DE QUEM É A CULPA.'
                    ],
                    cor: 'cor-raiko'
                };
            }

            if (lowerUserName === 'william') {
                return {
                    mensagens: [
                        'ENTÃO...',
                        'VOCÊ AINDA ESTÁ VIVO DEPOIS DAQUILO?',
                        'INTERESSANTE...',
                        'MAS NÃO É O QUE VEJO.',
                        'SEU SOFRIMENTO NÃO É ETERNO',
                        'QUERO VER VOCÊ TENTAR ESCAPAR DE SEUS DEMÔNIOS',
                        'TODO.',
                        'SANTO.',
                        'DIA.',
                        'SE PODE ME OUVIR',
                        'VOCÊ NÃO PODE ESCAPAR.'
                    ],
                    cor: 'cor-william'
                };
            }

            if (lowerUserName === 'mary') {
                return {
                    mensagens: [
                        'MARY ATHEIAN?',
                        'VOCÊ REALMENTE CONSEGUIU CHEGAR AO PATAMAR DE RAINHA.',
                        'MAS, SERÁ SE VOCÊ VAI CONSEGUIR SE AGUENTAR?',
                        'PORQUE SEU ODIO ESTÁ CRESCENDO A CADA DIA.',
                        'E UMA HORA VOCÊ MESMA VAI ENTENDER QUE PRECISA TIRAR ISSO DE SI.',
                        'AFINAL, PESSOAS TE ADORAM.',
                        'E ISSO SIGNIFICA QUE MUITOS DEPENDEM DE VOCÊ, RAINHA',
                        'E CERTAS PESSOAS REALMENTE NÃO QUEREM SEU BEM.',
                        'MAS, ME IMPRESSIONA O QUANTO FIEL VOCÊ CONSEGUE SE MANTER A SEUS SENTIMENTOS.',
                        'EU QUERIA TER ESSA CAPACIDADE.'
                    ],
                    cor: 'cor-mary'
                };
            }

            if (lowerUserName === 'satoshi' || lowerUserName === 'gaster') {
                return {
                    mensagens: [
                        'AGORA COMO GASTER.',
                        'O HONEST FEZ UM ÓTIMO TRABALHO, TE COLOCANDO COMO CANDIDATO A PRÓXIMO RECEPTÁCULO.',
                        'SOMOS IGUAIS.',
                        'ESQUECIDOS.',
                        'MORTOS.',
                        'DETERIORANDO.',
                        'E VOCÊ ESTÁ FAZENDO UM TRABALHO EXCELENTE.',
                        'VOCÊ, DE FATO, É BEM, BEM INTERESSANTE.',
                        'LOGO JÁ ESTÁ NA HORA DE APOSENTAR ALGUÉM.',
                    ],
                    cor: 'cor-satoshi'
                };
            }

            if (lowerUserName === 'hank') {
                return {
                    mensagens: [
                        'OLÁ, SCHRADER.',
                        'VOCÊ PARECE CURIOSO SOBRE MIM.',
                        'MAS NÃO SE PREOCUPE, NÃO EXISTE NADA INTERESSANTE SOBRE MIM.',
                        'AFINAL, EU NÃO SOU HUMANO.',
                        'E VOCÊ TAMBÉM NÃO É.',
                        'MAS ELE, SIM.',
                        'VOLTANDO AO ASSUNTO REAL.',
                        'VOCÊ PRECISA ACEITAR O QUE VOCÊ VAI SE TORNAR EM BREVE.',
                        'ALGO MAIS PRÓXIMO DE MIM.',
                        'ACEITE SEU CARGO.'
                    ],
                    cor: 'cor-hank'
                };
            }

            if (lowerUserName === 'kitsune') {
                return {
                    mensagens: [
                        'O NOVO REI DEMÔNIO.',
                        'VOCÊ PRECISARÁ DE MUITA CORAGEM PARA SOBREVIVER NESSA GUERRA.',
                        'RENASÇA E VIVA A SUA VIDA.',
                        'JÁ QUE MUITAS MORTES VIRÃO A ACONTECER.',
                        'E VOCÊ SEMPRE FOI RODEADO POR ELA.',
                        'ABRAÇE-A.',
                        'E NÃO LARGUE JAMAIS A SUA EXISTÊNCIA.',
                        'JAMAIS.'
                    ],
                    cor: 'cor-kitsune'
                };
            }

            if (lowerUserName === 'jonatham' || lowerUserName === 'jonathan') {
                return {
                    mensagens: [
                        'VOCÊ NÃO É ELE.',
                    ],
                    cor: 'cor-jonatham'
                };
            }

            if (lowerUserName === 'fenrir' ) {
                return {
                    mensagens: [
                        'O ROXO.',
                        'ELE TENTOU MUITAS VEZES AJUDAR A TODOS E ACABOU SEM AJUDA QUANDO PRECISAVA.',
                        'UM SER DISTRIBUÍDO PARA MUITOS.',
                        'ATÉ MESMO COM UM CONECTADO, ELE CONFIOU.',
                        'MAS NÃO VAI ACONTECER OUTRA VEZ.',
                        'GABE NÃO VAI.'
                    ],
                    cor: 'cor-fenrir'
                };
            }

            // =============================================================
            // MODELO PARA ADICIONAR NOVO PERSONAGEM
            // =============================================================
            /*
            if (lowerUserName === 'nome' || lowerUserName === 'apelido') {
                return {
                    mensagens: [
                        'MENSAGEM 1',
                        'MENSAGEM 2'
                    ],
                    cor: 'cor-nome'
                };
            }
            */

            // =============================================================
            // RESPOSTA PADRÃO
            // =============================================================
            if (lowerUserName) {
                return {
                    mensagens: [
                        `"${userName}" NÃO É RECONHECIDO.`,
                        'TENTE UM NOME DE PERSONAGEM OU "help" PARA OPÇÕES.'
                    ],
                    cor: ''
                };
            }

            return {
                mensagens: ['COMANDO INVÁLIDO.'],
                cor: ''
            };
        }

        // =============================================================
        // PROCESSAR COMANDO (CORRIGIDO - AGORA INCLUI ATHENA)
        // =============================================================
        async function processCommand() {
            const raw = input.value.trim();
            if (raw === '' || isProcessingQueue) return;

            // Exibe o eco do comando
            await exibirMensagens([`$ ${raw}`]);

            // Obtém a resposta
            const resposta = getMensagens(raw);
            await exibirMensagens(resposta.mensagens, resposta.cor);

            // =============================================================
            // REDIRECIONAMENTOS BASEADOS NO COMANDO ORIGINAL
            // =============================================================
            const lowerRaw = raw.toLowerCase();
            
            // REDIRECIONAMENTO PARA ATHENA (ADICIONADO)
            if (lowerRaw === 'athena') {
                setTimeout(() => {
                    window.location.href = CONFIG.athenaRedirectUrl;
                }, 2000);
            }
            
            if (lowerRaw === 'milly') {
                setTimeout(() => {
                    window.location.href = CONFIG.millyRedirectUrl;
                }, 2000);
            }
            
            if (lowerRaw === 'agnes') {
                setTimeout(() => {
                    window.location.href = CONFIG.agnesRedirectUrl;
                }, 2000);
            }

            input.value = '';
            input.focus();
        }

        // =============================================================
        // EVENTOS
        // =============================================================
        btnEnviar.addEventListener('click', processCommand);
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') processCommand();
        });
        input.addEventListener('input', playTyping);

        window.addEventListener('resize', scrollToBottomIfNeeded);

        window.addEventListener('load', () => {
            input.focus();
        });

        // =============================================================
        // EXPORTAÇÃO PARA CONSOLE
        // =============================================================
        window.exibirMensagens = exibirMensagens;
        window.getMensagens = getMensagens;
    </script>
</body>
</html>
